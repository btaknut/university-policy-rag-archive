[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "university-policy-rag-archive"
version = "0.1.0"
description = "국립한국교통대학교 규정·지침 RAG 코퍼스 파이프라인"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.23", "pypdf>=5.0", "python-docx>=1.1", "beautifulsoup4>=4.12", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
