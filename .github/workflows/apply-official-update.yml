name: Apply official update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '계획 검증 또는 Gate 통과 후 draft PR 생성'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - create_pr
      batch_path:
        description: '검토 완료 배치 JSON 경로'
        required: true
        default: reports/p1_official_update_batch_2026-09-03.json
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: official-update-apply
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - name: Require default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "이 워크플로는 기본 브랜치에서만 실행할 수 있습니다."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python and LFS requirements
        run: |
          python -m pip install -r requirements.txt
          git lfs install --local
          git lfs version
      - name: Download and verify official files
        run: |
          python scripts/download_official_batch.py \
            --batch "${{ inputs.batch_path }}" \
            --output-dir .artifacts/official-downloads
      - name: Plan only
        if: inputs.mode == 'plan'
        run: |
          python scripts/run_official_update_gate.py \
            --batch "${{ inputs.batch_path }}" \
            --downloads-dir .artifacts/official-downloads
      - name: Apply portable Gate
        if: inputs.mode == 'create_pr'
        run: |
          python scripts/run_official_update_gate.py \
            --batch "${{ inputs.batch_path }}" \
            --downloads-dir .artifacts/official-downloads \
            --install-unhwp \
            --apply
      - name: Create draft pull request
        if: inputs.mode == 'create_pr'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="automation/official-update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "${branch}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git lfs status
          git commit -m "data: apply verified official policy updates"
          git push --set-upstream origin "${branch}"
          gh pr create \
            --draft \
            --base "${DEFAULT_BRANCH}" \
            --head "${branch}" \
            --title "data: apply verified official policy updates" \
            --body "공식 원천 배치를 portable HWP Gate로 반영한 자동 생성 초안입니다. 원본·Markdown 해시, 한국어 품질, 코퍼스 검증과 전체 테스트를 통과했습니다. 병합 전 변경 파일과 공식 상세 페이지를 수동 검토하십시오."
      - name: Upload Gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-update-gate-${{ github.run_id }}
          path: |
            .artifacts/official-downloads/
            .artifacts/official-update/
            reports/hwp_portable_conversion.md
            reports/corpus_validation.md
          if-no-files-found: warn
          retention-days: 30
