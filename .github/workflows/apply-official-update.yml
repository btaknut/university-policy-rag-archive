name: Apply official update

on:
  push:
    branches:
      - main
    paths:
      - 'reports/codex_official_update_batch_*.json'
  workflow_dispatch:
    inputs:
      mode:
        description: '계획 검증 또는 Gate 통과 후 PR 생성'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - create_pr
      batch_path:
        description: '검토 완료 배치 JSON 경로'
        required: true
        default: reports/p1_official_update_batch_2026-09-03.json
        type: string
      merge_after_gate:
        description: '모든 Gate 통과 후 생성된 데이터 PR 자동 병합'
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: official-update-apply
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          lfs: false
          fetch-depth: 0
      - name: Require default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "이 워크플로는 기본 브랜치에서만 실행할 수 있습니다."
            exit 1
          fi
      - name: Resolve run parameters
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_BATCH_PATH: ${{ inputs.batch_path }}
          INPUT_MERGE_AFTER_GATE: ${{ inputs.merge_after_gate }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            mode="${INPUT_MODE}"
            batch_path="${INPUT_BATCH_PATH}"
            merge_after_gate="${INPUT_MERGE_AFTER_GATE}"
          else
            mapfile -t batch_paths < <(
              git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" -- \
                'reports/codex_official_update_batch_*.json'
            )
            if [[ "${#batch_paths[@]}" -ne 1 ]]; then
              echo "자동 실행은 신규 또는 변경 배치 JSON 1개만 허용합니다."
              printf '%s\n' "${batch_paths[@]}"
              exit 1
            fi
            mode="create_pr"
            batch_path="${batch_paths[0]}"
            merge_after_gate="true"
          fi

          if [[ ! "${batch_path}" =~ ^reports/(codex|p1)_official_update_batch_[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$ ]]; then
            echo "허용되지 않은 batch_path입니다: ${batch_path}"
            exit 1
          fi
          if [[ ! -f "${batch_path}" ]]; then
            echo "batch_path 파일을 찾을 수 없습니다: ${batch_path}"
            exit 1
          fi
          if [[ "${mode}" != "plan" && "${mode}" != "create_pr" ]]; then
            echo "허용되지 않은 mode입니다: ${mode}"
            exit 1
          fi
          if [[ "${merge_after_gate}" != "true" && "${merge_after_gate}" != "false" ]]; then
            echo "merge_after_gate는 true 또는 false여야 합니다."
            exit 1
          fi
          if [[ "${mode}" != "create_pr" && "${merge_after_gate}" == "true" ]]; then
            echo "plan 모드에서는 자동 병합을 사용할 수 없습니다."
            exit 1
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "batch_path=${batch_path}" >> "${GITHUB_OUTPUT}"
          echo "merge_after_gate=${merge_after_gate}" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install Python and LFS requirements
        run: |
          python -m pip install -r requirements.txt
          git lfs install --local
          git lfs version
      - name: Download and verify official files
        run: |
          python scripts/download_official_batch.py \
            --batch "${{ steps.resolve.outputs.batch_path }}" \
            --output-dir .artifacts/official-downloads
      - name: Plan only
        if: steps.resolve.outputs.mode == 'plan'
        run: |
          python scripts/run_official_update_gate.py \
            --batch "${{ steps.resolve.outputs.batch_path }}" \
            --downloads-dir .artifacts/official-downloads
      - name: Apply portable Gate
        if: steps.resolve.outputs.mode == 'create_pr'
        run: |
          python scripts/run_official_update_gate.py \
            --batch "${{ steps.resolve.outputs.batch_path }}" \
            --downloads-dir .artifacts/official-downloads \
            --install-unhwp \
            --apply
      - name: Create and optionally merge data pull request
        if: steps.resolve.outputs.mode == 'create_pr'
        id: data_pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BATCH_PATH: ${{ steps.resolve.outputs.batch_path }}
          MERGE_AFTER_GATE: ${{ steps.resolve.outputs.merge_after_gate }}
        run: |
          set -euo pipefail
          branch="automation/official-update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "${branch}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false
          mapfile -t changed_paths < <(git status --porcelain=v1 --untracked-files=all | cut -c4-)
          for changed_path in "${changed_paths[@]}"; do
            case "${changed_path}" in
              sources/raw/*|corpus/normalized/*|metadata/documents.jsonl|metadata/versions.jsonl|metadata/source_manifest.jsonl|metadata/portable_hwp_manifest.jsonl|metadata/current_documents.jsonl|metadata/latest_documents.jsonl|rag/chunks.jsonl|rag/document_catalog.jsonl|rag/corpus_manifest.json|rag/retrieval_examples.json|catalog/*|reports/corpus_validation.md|reports/hwp_portable_conversion.md) ;;
              *) echo "Gate 허용목록 밖 변경을 거부합니다: ${changed_path}"; exit 1 ;;
            esac
          done
          git add -- sources/raw corpus/normalized metadata rag/chunks.jsonl rag/document_catalog.jsonl rag/corpus_manifest.json rag/retrieval_examples.json catalog reports/corpus_validation.md reports/hwp_portable_conversion.md
          git diff --cached --check
          git lfs status
          if git diff --cached --quiet; then
            echo "Gate 통과 후 커밋할 변경이 없습니다."
            exit 1
          fi
          git commit -m "data: apply verified official policy updates"
          git push --set-upstream origin "${branch}"

          head_sha="$(git rev-parse HEAD)"
          gh workflow run validate-corpus.yml --ref "${branch}"
          pr_args=(
            --base "${DEFAULT_BRANCH}"
            --head "${branch}"
            --title "data: apply verified official policy updates"
            --body "공식 배치 \`${BATCH_PATH}\`를 portable HWP Gate로 반영했습니다. 공식 원문 재다운로드, 파일 크기·SHA-256, 변환 품질, 코퍼스 검증, Git LFS 상태와 전체 테스트를 통과했습니다. 자동 실행에서는 현재 HEAD가 유지된 경우에만 squash 병합합니다."
          )
          if [[ "${MERGE_AFTER_GATE}" != "true" ]]; then
            pr_args+=(--draft)
          fi
          pr_url="$(gh pr create "${pr_args[@]}")"
          echo "pr_url=${pr_url}" >> "${GITHUB_OUTPUT}"

          if [[ "${MERGE_AFTER_GATE}" == "true" ]]; then
            required_checks="0"
            for _ in {1..20}; do
              required_checks="$(gh pr checks "${pr_url}" --required --json name --jq 'length' 2>/dev/null || printf '0')"
              if [[ "${required_checks}" -ge 1 ]]; then
                break
              fi
              sleep 3
            done
            if [[ "${required_checks}" -lt 1 ]]; then
              echo "데이터 커밋의 독립 필수 상태 검사가 시작되지 않았습니다. PR을 남기고 병합하지 않습니다."
              exit 1
            fi
            gh pr checks "${pr_url}" --required --watch --fail-fast
            current_head="$(gh pr view "${pr_url}" --json headRefOid --jq '.headRefOid')"
            if [[ "${current_head}" != "${head_sha}" ]]; then
              echo "데이터 PR HEAD가 Gate 커밋에서 변경되었습니다."
              exit 1
            fi
            current_base="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq '.sha')"
            if [[ "${current_base}" != "${GITHUB_SHA}" ]]; then
              echo "Gate 실행 후 기본 브랜치가 변경되었습니다. 최신 main에서 다시 실행하십시오."
              exit 1
            fi
            gh pr merge "${pr_url}" \
              --squash \
              --delete-branch \
              --match-head-commit "${head_sha}"
            merge_sha="$(gh pr view "${pr_url}" --json mergeCommit --jq '.mergeCommit.oid')"
            if [[ -z "${merge_sha}" ]]; then
              echo "병합 커밋을 확인하지 못했습니다."
              exit 1
            fi
            merged_base="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq '.sha')"
            if [[ "${merged_base}" != "${merge_sha}" ]]; then
              echo "병합 커밋이 기본 브랜치 HEAD에 반영되지 않았습니다."
              exit 1
            fi
            echo "merged=true" >> "${GITHUB_OUTPUT}"
            echo "merge_sha=${merge_sha}" >> "${GITHUB_OUTPUT}"
          else
            echo "merged=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Upload Gate artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-update-gate-${{ github.run_id }}
          path: |
            .artifacts/official-downloads/
            .artifacts/official-update/
            reports/hwp_portable_conversion.md
            reports/corpus_validation.md
          if-no-files-found: warn
          retention-days: 30
