name: validate-corpus
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Materialize approved C-2 data
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/chunk-migration-v2-20260908'
        run: |
          test ! -e rag/chunk_id_mapping_v1_to_v2.json
          python scripts/build_chunks.py \
            --mode rechunk \
            --allow-id-changes \
            --mapping-output rag/chunk_id_mapping_v1_to_v2.json \
            --check-determinism
          python scripts/build_catalog.py
          python scripts/build_github_catalog.py
          python scripts/validate_corpus.py
          python scripts/build_search_index.py
          python scripts/evaluate_retrieval.py
          python -m pytest -q
          git diff --exit-code origin/main -- metadata/source_manifest.jsonl sources .gitattributes .github/workflows/apply-official-update.yml
          git checkout origin/main -- .github/workflows/validate-corpus.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/retrieval_eval.json rag/chunks.jsonl rag/chunk_id_mapping_v1_to_v2.json rag/corpus_manifest.json rag/retrieval_examples.json reports/chunk_migration_result_2026-09-08.md tests/test_search.py .github/workflows/validate-corpus.yml
          git diff --cached --check
          git commit -m "data: materialize deterministic chunk migration v2"
          git push origin HEAD:${GITHUB_HEAD_REF}
