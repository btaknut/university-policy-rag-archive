name: validate-corpus
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/validate_corpus.py
      - run: python scripts/build_search_index.py
      - run: python scripts/evaluate_retrieval.py
      - run: python -c "import json; m=json.load(open('rag/corpus_manifest.json',encoding='utf-8')); print(m)"
