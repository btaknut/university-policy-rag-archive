name: PR B deterministic regeneration

on:
  push:
    branches:
      - codex/archive-search-data-20260907

permissions:
  contents: write

concurrency:
  group: pr-b-regenerate-20260907
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Regenerate PR B data
        run: python scripts/migrate_prb_data.py
      - name: Commit verified data and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr-b-regenerate.yml scripts/migrate_prb_data.py
          git add -- corpus/normalized metadata rag/chunks.jsonl rag/document_catalog.jsonl rag/corpus_manifest.json rag/retrieval_examples.json catalog reports/corpus_validation.md reports/archive_search_data_regeneration_2026-09-07.md
          git diff --cached --check
          git commit -m "data: regenerate archive search derivatives"
          git push origin HEAD:codex/archive-search-data-20260907
