name: check-official-sources

on:
  schedule:
    # 매주 월요일 07:15 KST
    - cron: '15 22 * * 0'
  workflow_dispatch:
    inputs:
      source_id:
        description: '비우면 4개 원천 전체, 아니면 source_id 1개'
        required: false
        type: choice
        options:
          - ''
          - ut_regulations
          - ut_guidelines
          - sanhak_regulations
          - sanhak_guidelines
      download_new:
        description: '신규 후보 원문을 workflow artifact로만 다운로드'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: official-source-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Check official sources
        shell: bash
        run: |
          args=(
            --config config/official_sources.yaml
            --output-dir .artifacts/official-source-check
            --fail-on-source-error
          )
          if [[ -n "${{ inputs.source_id }}" ]]; then
            args+=(--source "${{ inputs.source_id }}")
          fi
          if [[ "${{ inputs.download_new }}" == "true" ]]; then
            args+=(--download-new)
          fi
          python scripts/check_official_sources.py "${args[@]}"
      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-source-check-${{ github.run_id }}
          path: .artifacts/official-source-check/
          if-no-files-found: error
          retention-days: 30
